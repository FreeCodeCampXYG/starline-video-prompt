interface:
  display_name: "Starline Video Prompt"
  author: "墨点星痕 (starline)"
  short_description: "生成带故事因果、角色演技、光线物理和电影调度的 FLUX / Seedance 提示词"
  default_prompt: "Use $starline-video-prompt to turn my topic into a director-grade FLUX 3 or Seedance prompt. Build a clear dramatic cause-and-effect spine, lock identity and scene continuity, direct character reactions through timed physical performance beats, ground materials and lighting in physical evidence, and end on a stable handoff frame. Keep internal framework labels out of story-facing scripts."
  examples:
    - "把我的 AI 学习复盘写成一段有冲突推进和稳定尾帧的 FLUX 3 视频提示词"
    - "把这份 GitHub 项目说明拆成六段连续的英文导演提示词"
    - "设计一个即梦/Seedance 风格的快速技术纪录片镜头，不要慢镜头"
    - "把 AI 领导力拍成原创复古太空史诗，写出舰长的微表演与舰队战术"
compatibility:
  canonical_format: "agent-skills"
  adapter_targets: ["openai", "claude", "generic", "agent-skills-compatible"]
  execution:
    runtime: "python>=3.10 optional"
  permissions:
    network: "none"
    file_write: "only local prompt artifacts when explicitly requested"
    secret: "none"
  degradation:
    no_reference_media: "write a character and scene bible, and label identity consistency as unverified"
